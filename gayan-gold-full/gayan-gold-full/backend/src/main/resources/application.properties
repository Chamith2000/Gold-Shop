spring.application.name=gayan-gold-backend
server.port=${PORT:8090}

# MySQL - default local / Docker
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gayan_gold}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Chamith2000@@@@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET:GayanGoldHouseSuperSecretKeyForJWT2026MustBeLongEnoughForHS256Algorithm!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS - frontend typically on Vite 5173 or similar
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

CORS_ALLOWED_ORIGINS=https://YOUR-FRONTEND.onrender.com
#http://localhost:5173,https://YOUR-FRONTEND.onrender.com

# WhatsApp Business Cloud API
# Keep credentials in environment variables / Docker secrets, never in source control.
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.api-version=${WHATSAPP_API_VERSION}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}
app.whatsapp.recipient-phone-number=${WHATSAPP_RECIPIENT_PHONE_NUMBER}
app.whatsapp.order-template-name=${WHATSAPP_ORDER_TEMPLATE_NAME:order_placed}
app.whatsapp.order-template-language=${WHATSAPP_ORDER_TEMPLATE_LANGUAGE:en_US}

# File upload / image base64 limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.example.gayangold=INFO
logging.level.org.springframework.security=WARN
