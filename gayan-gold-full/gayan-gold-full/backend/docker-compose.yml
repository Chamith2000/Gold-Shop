  #     mysql:
  #       condition: service_healthy
  #   environment:
  #     DB_HOST: mysql
  #     DB_PORT: 3306
  #     DB_NAME: gayan_gold
  #     DB_USERNAME: gayan
  #     DB_PASSWORD: gayan_gold_secret
